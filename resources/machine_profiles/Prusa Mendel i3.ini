[machine]
machine_name = Prusa Mendel i3
machine_type = prusai3
machine_width = 195
machine_depth = 195
machine_height = 195
machine_center_is_zero = False
has_heated_bed = True
gcode_flavor = RepRap (Marlin/Sprinter)
extruder_amount = 1

[profile]
filament_diameter = 3
nozzle_size = 0.5
retraction_enable = True
retraction_speed = 25
retraction_amount = 1.5
retraction_combing = All
retraction_minimal_extrusion = 0.15
retraction_hop = 0.1

print_speed = 65
travel_speed = 100
bottom_layer_speed = 40
infill_speed = 0.0
solidarea_speed = 45
inset0_speed = 45
insetx_speed = 0.0

layer_height = 0.256
solid_layer_thickness = 1.024
wall_thickness = 1
fill_density = 25

print_temperature = 225
print_bed_temperature = 100
layer0_width_factor = 125
bottom_thickness = 0.3
filament_flow = 100
cool_min_layer_time = 6
fan_enabled = False
fan_full_height = 1
fan_speed = 75
fan_speed_max = 100
cool_min_feedrate = 15



support = None
platform_adhesion = None
skirt_line_count = 2
skirt_gap = 3.0
brim_line_count = 10

[alterations]
start.gcode = ;Sliced at: {day} {date} {time}
	;Basic settings: Layer height: {layer_height} Walls: {wall_thickness} Fill: {fill_density}
	;Print time: {print_time}
	;Filament used: {filament_amount}m {filament_weight}g
	;Filament cost: {filament_cost}
	;M190 S{print_bed_temperature} ;Uncomment to add your own bed temperature line
	;M109 S{print_temperature} ;Uncomment to add your own temperature line
	G21        ;metric values
	G90        ;absolute positioning
	M82        ;set extruder to absolute mode
	M107       ;start with the fan off
	G28
	G1 Z5.0 F{travel_speed} ;move the platform down 15mm
	G92 E0                  ;zero the extruded length
	G1 F500 E5              ;extrude 3mm of feed stock
	G1 Y20 Z0.2 E10 F500
	G1 Y150 E15
	G92 E0                  ;zero the extruded length again
	G1 F{travel_speed}
	;Put printing message on LCD screen
	M117 Materializando...
end.gcode = ;End GCode
	M104 S0                     ;extruder heater off
	M140 S0                     ;heated bed heater off (if you have it)
	G91                                    ;relative positioning
	G1 E-1 F300                            ;retract the filament a bit before lifting the nozzle, to release some of the pressure
	G1 Z+0.5 E-5 X-20 Y-20 F{travel_speed} ;move Z up a bit and retract filament even more
	G28 X Y                              ;move X/Y to min endstops, so the head is out of the way
	G0 Y250
	M84                         ;steppers off
	G90                         ;absolute positioning
	M117 Terminado!
	;{profile_string}
	
